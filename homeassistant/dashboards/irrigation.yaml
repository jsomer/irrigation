# Irrigation Lovelace dashboard — simplified operator layout with tabbed views.
# Moisture graph requires HACS "auto-entities" (Frontend → search auto-entities → install → reload).

title: Irrigation
views:
  - title: Overview
    path: irrigation
    icon: mdi:sprinkler-variant
    type: sections
    sections:
      - type: grid
        title: Moisture
        cards:
          - type: custom:auto-entities
            show_empty: false
            card:
              type: history-graph
              title: Moisture (8 h)
              hours_to_show: 8
            filter:
              template: |
                [{% for i in range(6) %}
                {% if is_state('input_boolean.irrigation_sensor_' ~ i ~ '_enabled', 'on') %}
                {'entity': 'sensor.irrigation_sensor_{{ i }}_vwc', 'name': states('input_text.irrigation_sensor_{{ i }}_label') or 'Sensor {{ i }}'},
                {% endif %}
                {% endfor %}]

          - type: markdown
            title: Matrix Summary
            content: "{{ states('sensor.irrigation_zone_delta') }}"

          - type: conditional
            conditions:
              - entity: input_boolean.irrigation_sensor_0_enabled
                state: "on"
            card:
              type: gauge
              name: Sensor 0
              entity: sensor.irrigation_sensor_0_vwc
              unit: "%"
              min: 0
              max: 60

          - type: conditional
            conditions:
              - entity: input_boolean.irrigation_sensor_1_enabled
                state: "on"
            card:
              type: gauge
              name: Sensor 1
              entity: sensor.irrigation_sensor_1_vwc
              unit: "%"
              min: 0
              max: 60

          - type: conditional
            conditions:
              - entity: input_boolean.irrigation_sensor_2_enabled
                state: "on"
            card:
              type: gauge
              name: Sensor 2
              entity: sensor.irrigation_sensor_2_vwc
              unit: "%"
              min: 0
              max: 60

          - type: conditional
            conditions:
              - entity: input_boolean.irrigation_sensor_3_enabled
                state: "on"
            card:
              type: gauge
              name: Sensor 3
              entity: sensor.irrigation_sensor_3_vwc
              unit: "%"
              min: 0
              max: 60

          - type: conditional
            conditions:
              - entity: input_boolean.irrigation_sensor_4_enabled
                state: "on"
            card:
              type: gauge
              name: Sensor 4
              entity: sensor.irrigation_sensor_4_vwc
              unit: "%"
              min: 0
              max: 60

          - type: conditional
            conditions:
              - entity: input_boolean.irrigation_sensor_5_enabled
                state: "on"
            card:
              type: gauge
              name: Sensor 5
              entity: sensor.irrigation_sensor_5_vwc
              unit: "%"
              min: 0
              max: 60

      - type: grid
        title: Status
        cards:
          - type: entities
            title: System
            entities:
              - entity: input_select.irrigation_control_mode
                name: Mode
              - entity: sensor.irrigation_auto_block_reason
                name: Auto Status
              - entity: binary_sensor.irrigation_controller_online
                name: Controller Online
              - entity: sensor.irrigation_valve_state
                name: Valve State
              - entity: binary_sensor.irrigation_valve
                name: Valve Open
              - entity: input_text.irrigation_cycle_time_remaining
                name: Time Remaining
              - entity: sensor.irrigation_actual_pulse_s
                name: Last Pulse (s)
              - entity: input_datetime.irrigation_last_settle_at
                name: Last Snapshot
              - entity: sensor.irrigation_error_code
                name: Error Code

          - type: markdown
            content: |
              **Normal use:** watch the moisture graph, keep an eye on **Auto Status**, and adjust only the moisture thresholds and pulse timing when plant placement or weather changes.

              **Matrix mindset:** the goal is a repeatable planting band, not uniform moisture across the entire bed.

  - title: Controls
    path: irrigation-controls
    icon: mdi:tune
    type: sections
    sections:
      - type: grid
        title: Manual Controls
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: button
                name: Pulse
                icon: mdi:water
                show_name: true
                show_icon: true
                tap_action:
                  action: call-service
                  service: script.turn_on
                  service_data:
                    entity_id: script.irrigation_request_pulse
              - type: button
                name: Close
                icon: mdi:stop-circle
                show_name: true
                show_icon: true
                tap_action:
                  action: call-service
                  service: script.turn_on
                  service_data:
                    entity_id: script.irrigation_force_close
              - type: button
                name: Clear Fault
                icon: mdi:alert-remove-outline
                show_name: true
                show_icon: true
                tap_action:
                  action: call-service
                  service: script.turn_on
                  service_data:
                    entity_id: script.irrigation_clear_fault
              - type: button
                name: Sync
                icon: mdi:sync
                show_name: true
                show_icon: true
                tap_action:
                  action: call-service
                  service: script.turn_on
                  service_data:
                    entity_id: script.irrigation_sync_firmware

          - type: markdown
            content: |
              **Auto rule:** if any enabled sensor falls below its minimum and the valve is idle, Home Assistant requests a pulse.

              **Pulse size:** scaled from moisture deficit between each sensor's **min** and **target**.

      - type: grid
        title: Irrigation Timing
        cards:
          - type: entities
            title: Timing
            entities:
              - entity: input_number.irrigation_min_pulse_min
                name: Min Pulse (min)
              - entity: input_number.irrigation_max_pulse_min
                name: Max Pulse (min)
              - entity: input_number.irrigation_settle_min
                name: Settle (min)
              - entity: input_number.irrigation_failsafe_disconnect_min
                name: MQTT Failsafe (min)

      - type: grid
        title: Active Sensor Targets
        cards:
          - type: conditional
            conditions:
              - entity: input_boolean.irrigation_sensor_0_enabled
                state: "on"
            card:
              type: entities
              title: Sensor 0 Thresholds
              entities:
                - entity: input_number.irrigation_sensor0_min_vwc
                  name: Min / Start
                - entity: input_number.irrigation_sensor0_target_vwc
                  name: Target
                - entity: input_number.irrigation_sensor0_max_vwc
                  name: Max

          - type: conditional
            conditions:
              - entity: input_boolean.irrigation_sensor_1_enabled
                state: "on"
            card:
              type: entities
              title: Sensor 1 Thresholds
              entities:
                - entity: input_number.irrigation_sensor1_min_vwc
                  name: Min / Start
                - entity: input_number.irrigation_sensor1_target_vwc
                  name: Target
                - entity: input_number.irrigation_sensor1_max_vwc
                  name: Max

          - type: conditional
            conditions:
              - entity: input_boolean.irrigation_sensor_2_enabled
                state: "on"
            card:
              type: entities
              title: Sensor 2 Thresholds
              entities:
                - entity: input_number.irrigation_sensor2_min_vwc
                - entity: input_number.irrigation_sensor2_target_vwc
                - entity: input_number.irrigation_sensor2_max_vwc

          - type: conditional
            conditions:
              - entity: input_boolean.irrigation_sensor_3_enabled
                state: "on"
            card:
              type: entities
              title: Sensor 3 Thresholds
              entities:
                - entity: input_number.irrigation_sensor3_min_vwc
                - entity: input_number.irrigation_sensor3_target_vwc
                - entity: input_number.irrigation_sensor3_max_vwc

          - type: conditional
            conditions:
              - entity: input_boolean.irrigation_sensor_4_enabled
                state: "on"
            card:
              type: entities
              title: Sensor 4 Thresholds
              entities:
                - entity: input_number.irrigation_sensor4_min_vwc
                - entity: input_number.irrigation_sensor4_target_vwc
                - entity: input_number.irrigation_sensor4_max_vwc

          - type: conditional
            conditions:
              - entity: input_boolean.irrigation_sensor_5_enabled
                state: "on"
            card:
              type: entities
              title: Sensor 5 Thresholds
              entities:
                - entity: input_number.irrigation_sensor5_min_vwc
                - entity: input_number.irrigation_sensor5_target_vwc
                - entity: input_number.irrigation_sensor5_max_vwc

  - title: Sensors
    path: irrigation-sensors
    icon: mdi:water-percent
    type: sections
    sections:
      - type: grid
        title: Sensor Slots
        cards:
          - type: entities
            title: Enable & Label
            show_header_toggle: false
            entities:
              - entity: input_boolean.irrigation_sensor_0_enabled
                name: S0 Enabled (A0)
              - entity: input_text.irrigation_sensor_0_label
                name: S0 Label
              - entity: input_boolean.irrigation_sensor_1_enabled
                name: S1 Enabled (A1)
              - entity: input_text.irrigation_sensor_1_label
                name: S1 Label
              - entity: input_boolean.irrigation_sensor_2_enabled
                name: S2 Enabled (A2)
              - entity: input_text.irrigation_sensor_2_label
                name: S2 Label
              - entity: input_boolean.irrigation_sensor_3_enabled
                name: S3 Enabled (A3)
              - entity: input_text.irrigation_sensor_3_label
                name: S3 Label
              - entity: input_boolean.irrigation_sensor_4_enabled
                name: S4 Enabled (A4)
              - entity: input_text.irrigation_sensor_4_label
                name: S4 Label
              - entity: input_boolean.irrigation_sensor_5_enabled
                name: S5 Enabled (A5)
              - entity: input_text.irrigation_sensor_5_label
                name: S5 Label

      - type: grid
        title: Calibration
        cards:
          - type: conditional
            conditions:
              - entity: input_boolean.irrigation_sensor_0_enabled
                state: "on"
            card:
              type: entities
              title: Sensor 0
              entities:
