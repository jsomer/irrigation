# Irrigation Lovelace dashboard — Status-first operator layout.
# Moisture history uses built-in history-graph cards (no HACS auto-entities).

title: Irrigation
views:
  - title: Status
    path: irrigation
    icon: mdi:water-pump
    type: sections
    sections:
      - type: grid
        title: Water Status
        cards:
          - type: markdown
            content: >
              ## {{ states('sensor.irrigation_water_status') }}

              {% set st = states('sensor.irrigation_water_status') %}
              {% if st == 'Watering Now' %}
              **{{ state_attr('sensor.irrigation_water_status', 'action') }}** — {{ states('input_text.irrigation_cycle_time_remaining') }}
              {% else %}
              {% set lw = states('input_datetime.irrigation_pulse_started_at') %}
              {% if lw not in ['unknown', 'unavailable', 'none', ''] %}
              {% set dur = states('sensor.irrigation_actual_pulse_s') | int(0) %}
              Last watered {{ relative_time(as_datetime(lw)) }} ago{% if dur > 0 %} for {{ (dur / 60) | round(1) }} min{% endif %}
              {% else %}
              Last watered: never
              {% endif %}
              {% endif %}


              **Reason:** {{ state_attr('sensor.irrigation_water_status', 'reason') }}

              _{{ state_attr('sensor.irrigation_water_status', 'resume_hint') }}_

      - type: grid
        title: Diagnostics
        cards:
          - type: entities
            title: System State
            entities:
              - entity: input_select.irrigation_control_mode
                name: Mode
              - entity: binary_sensor.irrigation_controller_online
                name: Controller
              - entity: sensor.irrigation_auto_block_reason
                name: Auto Status
              - entity: sensor.irrigation_valve_state_resolved
                name: Valve State (Resolved)
              - entity: sensor.irrigation_valve_state
                name: Valve Command (Firmware State)
              - entity: binary_sensor.irrigation_valve
                name: Valve Feedback (Open)
              - entity: sensor.irrigation_error_code
                name: Error Code

          - type: entities
            title: Recent Activity
            entities:
              - entity: input_datetime.irrigation_pulse_started_at
                name: Last Water Event
              - entity: sensor.irrigation_actual_pulse_min
                name: Last Water Duration (min)
              - entity: input_text.irrigation_last_stop_reason
                name: Last Stop Reason
              - entity: input_datetime.irrigation_last_settle_at
                name: Last Settle Snapshot
              - entity: input_text.irrigation_settle_snapshot_gaps
                name: Settle Snapshot Coverage

  - title: Moisture
