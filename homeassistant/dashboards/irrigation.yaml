                name: Time Range
              - entity: input_select.irrigation_chart_sensor_mode
                name: Sensors (gauges / future filters)
              - entity: input_boolean.irrigation_chart_show_watering
                name: "Overlay: Watering (always on graph)"
              - entity: input_boolean.irrigation_chart_show_settle
                name: "Overlay: Settle (always on graph)"
              - entity: input_boolean.irrigation_chart_show_errors
                name: "Overlay: Errors (always on graph)"

          - type: markdown
