                  name: Raw VWC
                - entity: sensor.irrigation_sensor_0_voltage
                  name: Signal V
                - entity: sensor.irrigation_sensor_0_vwc
                  name: Calibrated VWC
                - entity: input_number.irrigation_sensor0_vwc_scale
                  name: Scale
                - entity: input_number.irrigation_sensor0_vwc_offset
                  name: Offset

          - type: conditional
            conditions:
              - entity: input_boolean.irrigation_sensor_1_enabled
                state: "on"
            card:
              type: entities
              title: Sensor 1
              entities:
                - entity: sensor.irrigation_sensor_1_vwc_raw
                  name: Raw VWC
                - entity: sensor.irrigation_sensor_1_voltage
                  name: Signal V
                - entity: sensor.irrigation_sensor_1_vwc
                  name: Calibrated VWC
                - entity: input_number.irrigation_sensor1_vwc_scale
                  name: Scale
                - entity: input_number.irrigation_sensor1_vwc_offset
                  name: Offset

          - type: conditional
            conditions:
              - entity: input_boolean.irrigation_sensor_2_enabled
                state: "on"
            card:
              type: entities
              title: Sensor 2
              entities:
                - entity: sensor.irrigation_sensor_2_vwc_raw
                - entity: sensor.irrigation_sensor_2_voltage
                - entity: sensor.irrigation_sensor_2_vwc
                - entity: input_number.irrigation_sensor2_vwc_scale
                - entity: input_number.irrigation_sensor2_vwc_offset

          - type: conditional
            conditions:
              - entity: input_boolean.irrigation_sensor_3_enabled
                state: "on"
            card:
              type: entities
              title: Sensor 3
              entities:
                - entity: sensor.irrigation_sensor_3_vwc_raw
                - entity: sensor.irrigation_sensor_3_voltage
                - entity: sensor.irrigation_sensor_3_vwc
                - entity: input_number.irrigation_sensor3_vwc_scale
                - entity: input_number.irrigation_sensor3_vwc_offset

          - type: conditional
            conditions:
              - entity: input_boolean.irrigation_sensor_4_enabled
                state: "on"
            card:
              type: entities
              title: Sensor 4
              entities:
                - entity: sensor.irrigation_sensor_4_vwc_raw
                - entity: sensor.irrigation_sensor_4_voltage
                - entity: sensor.irrigation_sensor_4_vwc
                - entity: input_number.irrigation_sensor4_vwc_scale
                - entity: input_number.irrigation_sensor4_vwc_offset

          - type: conditional
            conditions:
              - entity: input_boolean.irrigation_sensor_5_enabled
                state: "on"
            card:
              type: entities
              title: Sensor 5
              entities:
                - entity: sensor.irrigation_sensor_5_vwc_raw
                - entity: sensor.irrigation_sensor_5_voltage
                - entity: sensor.irrigation_sensor_5_vwc
                - entity: input_number.irrigation_sensor5_vwc_scale
                - entity: input_number.irrigation_sensor5_vwc_offset

  - title: Advanced
    path: irrigation-advanced
    icon: mdi:tools
    type: sections
    sections:
      - type: grid
        title: Probe Tools
        cards:
          - type: markdown
            title: Probe Parity Check
            content: |
              **1. Reset both probes** (Scale=1, Offset=0). Bury two enabled probes side-by-side in moist soil; wait 1 min.

              **2. Compare Raw VWC and Signal V.** Same algorithm and ADC reference for all slots, so a gap here points to hardware more than math.

              **3. Swap test:** swap only the signal wires between two slots. If the bad reading follows the probe, it is the probe or the connection. If it stays on the slot, it is wiring to that input.

              **4. Align:** use the buttons below to match two probes before moving them back into the bed.

          - type: grid
            title: Align Probes
            columns: 2
            square: false
            cards:
              - type: button
                name: S0 → S1
                icon: mdi:arrow-right-bold
                tap_action:
                  action: call-service
                  service: script.turn_on
                  service_data:
                    entity_id: script.irrigation_calibrate_sensor0_to_sensor1
              - type: button
                name: S1 → S0
                icon: mdi:arrow-left-bold
                tap_action:
                  action: call-service
                  service: script.turn_on
                  service_data:
                    entity_id: script.irrigation_calibrate_sensor1_to_sensor0
              - type: button
                name: Reset S0
                icon: mdi:restore
                tap_action:
                  action: call-service
                  service: script.turn_on
                  service_data:
                    entity_id: script.irrigation_reset_sensor0_calibration
              - type: button
                name: Reset S1
                icon: mdi:restore
                tap_action:
                  action: call-service
                  service: script.turn_on
                  service_data:
                    entity_id: script.irrigation_reset_sensor1_calibration

      - type: grid
        title: Snapshot Data
        cards:
          - type: entities
            title: Last Settle Values
            entities:
              - entity: input_number.irrigation_last_settle_s0_vwc
                name: S0
              - entity: input_number.irrigation_last_settle_s1_vwc
                name: S1
              - entity: input_number.irrigation_last_settle_s2_vwc
                name: S2
              - entity: input_number.irrigation_last_settle_s3_vwc
                name: S3
              - entity: input_number.irrigation_last_settle_s4_vwc
                name: S4
              - entity: input_number.irrigation_last_settle_s5_vwc
                name: S5
              - entity: input_datetime.irrigation_last_settle_at
                name: Recorded At

          - type: markdown
            content: |
              This tab keeps the prototype instrumentation available without crowding normal operation.

              If you later want an even leaner grower dashboard, this is the first tab to prune.
