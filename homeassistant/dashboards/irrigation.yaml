  - title: Controls
    path: irrigation-controls
    icon: mdi:tune
    type: sections
    sections:
      - type: grid
        title: Manual Controls
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: button
                name: Pulse
                icon: mdi:water
                show_name: true
                show_icon: true
                tap_action:
                  action: call-service
                  service: script.turn_on
                  service_data:
                    entity_id: script.irrigation_request_pulse
              - type: button
                name: Close
                icon: mdi:stop-circle
                show_name: true
                show_icon: true
                tap_action:
                  action: call-service
                  service: script.turn_on
                  service_data:
                    entity_id: script.irrigation_manual_close
              - type: button
                name: Clear Fault
                icon: mdi:alert-remove-outline
                show_name: true
                show_icon: true
                tap_action:
                  action: call-service
                  service: script.turn_on
                  service_data:
                    entity_id: script.irrigation_clear_fault
              - type: button
                name: Sync
                icon: mdi:sync
                show_name: true
                show_icon: true
                tap_action:
                  action: call-service
                  service: script.turn_on
                  service_data:
                    entity_id: script.irrigation_sync_firmware

          - type: markdown
            content: |
              **Auto rule:** if any enabled sensor falls below its minimum and the valve is idle, Home Assistant requests a pulse.

              **Pulse size:** scaled from moisture deficit between each sensor's **min** and **target**.

              Pulse and Close will show a notification if the command is blocked (e.g. controller offline).

      - type: grid
        title: Irrigation Timing
        cards:
          - type: entities
            title: Timing
            entities:
              - entity: input_number.irrigation_min_pulse_min
                name: Min Pulse (min)
              - entity: input_number.irrigation_max_pulse_min
                name: Max Pulse (min)
              - entity: input_number.irrigation_settle_min
                name: Settle (min)
              - entity: input_number.irrigation_failsafe_disconnect_min
                name: MQTT Failsafe (min)

      - type: grid
        title: Active Sensor Targets
        cards:
          - type: button
            name: Sync All to Sensor 0
            icon: mdi:content-copy
            show_name: true
            show_icon: true
            tap_action:
              action: call-service
              service: script.turn_on
              service_data:
                entity_id: script.irrigation_sync_targets_to_sensor0
              confirmation:
                text: Copy Sensor 0's min/target/max to every other enabled sensor?

          - type: grid
            columns: 2
            square: false
            cards:
              - type: conditional
                conditions:
                  - entity: input_boolean.irrigation_sensor_0_enabled
                    state: "on"
                card:
                  type: entities
                  title: Sensor 0
                  entities:
                    - entity: input_number.irrigation_sensor0_min_vwc
                      name: Min
                    - entity: input_number.irrigation_sensor0_target_vwc
                      name: Target
                    - entity: input_number.irrigation_sensor0_max_vwc
                      name: Max

              - type: conditional
                conditions:
                  - entity: input_boolean.irrigation_sensor_1_enabled
                    state: "on"
                card:
                  type: entities
                  title: Sensor 1
                  entities:
                    - entity: input_number.irrigation_sensor1_min_vwc
                      name: Min
                    - entity: input_number.irrigation_sensor1_target_vwc
                      name: Target
                    - entity: input_number.irrigation_sensor1_max_vwc
                      name: Max

              - type: conditional
                conditions:
                  - entity: input_boolean.irrigation_sensor_2_enabled
                    state: "on"
                card:
                  type: entities
                  title: Sensor 2
                  entities:
                    - entity: input_number.irrigation_sensor2_min_vwc
                      name: Min
                    - entity: input_number.irrigation_sensor2_target_vwc
                      name: Target
                    - entity: input_number.irrigation_sensor2_max_vwc
                      name: Max

              - type: conditional
                conditions:
                  - entity: input_boolean.irrigation_sensor_3_enabled
                    state: "on"
                card:
                  type: entities
                  title: Sensor 3
                  entities:
                    - entity: input_number.irrigation_sensor3_min_vwc
                      name: Min
                    - entity: input_number.irrigation_sensor3_target_vwc
                      name: Target
                    - entity: input_number.irrigation_sensor3_max_vwc
                      name: Max

              - type: conditional
                conditions:
                  - entity: input_boolean.irrigation_sensor_4_enabled
                    state: "on"
                card:
                  type: entities
                  title: Sensor 4
                  entities:
                    - entity: input_number.irrigation_sensor4_min_vwc
                      name: Min
                    - entity: input_number.irrigation_sensor4_target_vwc
                      name: Target
                    - entity: input_number.irrigation_sensor4_max_vwc
                      name: Max

              - type: conditional
