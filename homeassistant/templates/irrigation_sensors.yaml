template:
  - trigger:
      - platform: mqtt
        topic: irrigation/sensor/0/telemetry
      - platform: state
        entity_id:
          - input_number.irrigation_sensor0_vwc_scale
          - input_number.irrigation_sensor0_vwc_offset
    sensor:
      - name: Irrigation Sensor 0 VWC Raw
        unique_id: irrigation_sensor_0_vwc_raw
        unit_of_measurement: "%"
        icon: mdi:water-opacity
        state: "{{ trigger.payload_json.vwc | default(0) | float(0) if trigger.platform == 'mqtt' else states('sensor.irrigation_sensor_0_vwc_raw') | float(0) }}"
      - name: Irrigation Sensor 0 Voltage
        unique_id: irrigation_sensor_0_voltage
        unit_of_measurement: V
        device_class: voltage
        icon: mdi:flash
        state: "{{ trigger.payload_json.voltage | default(0) | float(0) if trigger.platform == 'mqtt' else states('sensor.irrigation_sensor_0_voltage') | float(0) }}"
      - name: Irrigation Sensor 0 VWC
        unique_id: irrigation_sensor_0_vwc
        unit_of_measurement: "%"
        icon: mdi:water-percent
        state: |
          {% if trigger.platform == 'mqtt' %}
            {% set raw = trigger.payload_json.vwc | default(0) | float %}
          {% else %}
            {% set raw = states('sensor.irrigation_sensor_0_vwc_raw') | float(0) %}
          {% endif %}
          {% set scale = states('input_number.irrigation_sensor0_vwc_scale') | float(1) %}
          {% set offset = states('input_number.irrigation_sensor0_vwc_offset') | float(0) %}
          {% set v = raw * scale + offset %}
          {{ [0, [100, v] | min] | max | round(1) }}
      - name: Irrigation Sensor 0 Seen
        unique_id: irrigation_sensor_0_seen
        icon: mdi:clock-check-outline
        state: "{{ now().isoformat() if trigger.platform == 'mqtt' else states('sensor.irrigation_sensor_0_seen') }}"

