# UNSCOPED TEMPLATE — edit this file, then regenerate packages:
#   python3 scripts/render_ha_instances.py
# Do not deploy this file directly; deploy irrigation_sensors_<id>.yaml
#
# Sensor slots 0–5 — deploy alongside irrigation_<id>.yaml in config/packages/
# Enable/disable per slot in HA; firmware publishes all six A0–A5 pins.
#
# Persistence: helpers intentionally have NO `initial:` so enable toggles,
# labels, moisture bands, calibration, and snapshot values restore across HA
# restarts (an `initial:` value would reset them on every restart).
# On a brand-new install: enable the sensors you use, set labels, set bands
# (min 35 % / target 44 % / max 50 %), and run Reset calibration per sensor
# (scale 1.0 / offset 0).

