  # Freshness uses *Seen heartbeats (always change on MQTT), not VWC last_updated.
  # Steady moisture leaves last_updated stale and would falsely block auto watering.
  - trigger:
      - platform: state
        entity_id:
          - sensor.irrigation_sensor_0_seen
          - sensor.irrigation_sensor_1_seen
          - sensor.irrigation_sensor_2_seen
          - sensor.irrigation_sensor_3_seen
          - sensor.irrigation_sensor_4_seen
          - sensor.irrigation_sensor_5_seen
      - platform: time_pattern
        seconds: "/30"
    binary_sensor:
      - name: Irrigation Sensor 0 Fresh
        unique_id: irrigation_sensor_0_fresh
        state: >
          {{ states('sensor.irrigation_sensor_0_seen') not in ['unknown', 'unavailable', 'none', '']
             and states.sensor.irrigation_sensor_0_seen is not none
             and (now() - states.sensor.irrigation_sensor_0_seen.last_changed).total_seconds() < 90 }}
      - name: Irrigation Sensor 1 Fresh
        unique_id: irrigation_sensor_1_fresh
        state: >
          {{ states('sensor.irrigation_sensor_1_seen') not in ['unknown', 'unavailable', 'none', '']
