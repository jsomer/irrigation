# Home Assistant package — Smart Irrigation Controller
#
# Covers both zones (zone 0 and zone 1).
# All MQTT topics follow: irrigation/zone/<id>/<suffix>
#
# To enable: add to configuration.yaml:
#   homeassistant:
#     packages:
#       irrigation: !include packages/irrigation.yaml

mqtt:

  # ── Sensors ──────────────────────────────────────────────────────────────────
  sensor:

    # Zone 0
    - name: "Irrigation Zone 0 VWC"
      unique_id: irrigation_zone0_vwc
      state_topic: "irrigation/zone/0/telemetry"
      value_template: "{{ value_json.vwc | float }}"
      unit_of_measurement: "%"
      device_class: moisture
      state_class: measurement

    - name: "Irrigation Zone 0 State"
      unique_id: irrigation_zone0_state
      state_topic: "irrigation/zone/0/telemetry"
      value_template: "{{ value_json.state }}"

    - name: "Irrigation Zone 0 Fault Reason"
      unique_id: irrigation_zone0_fault_reason
      state_topic: "irrigation/zone/0/telemetry"
      value_template: "{{ value_json.fault_reason | default('none') }}"

    - name: "Irrigation Zone 0 Runtime Today"
      unique_id: irrigation_zone0_runtime_today
      state_topic: "irrigation/zone/0/telemetry"
      value_template: "{{ value_json.runtime_today_s }}"
      unit_of_measurement: "s"
      state_class: measurement

    - name: "Irrigation Zone 0 Runtime Hour"
      unique_id: irrigation_zone0_runtime_hour
      state_topic: "irrigation/zone/0/telemetry"
      value_template: "{{ value_json.runtime_hour_s }}"
      unit_of_measurement: "s"
      state_class: measurement

    - name: "Irrigation Zone 0 Pulse Count"
      unique_id: irrigation_zone0_pulse_count
      state_topic: "irrigation/zone/0/telemetry"
      value_template: "{{ value_json.pulse_count }}"
      state_class: total_increasing

    - name: "Irrigation Zone 0 Status"
      unique_id: irrigation_zone0_status
      state_topic: "irrigation/zone/0/status"

    # Zone 1
    - name: "Irrigation Zone 1 VWC"
      unique_id: irrigation_zone1_vwc
      state_topic: "irrigation/zone/1/telemetry"
      value_template: "{{ value_json.vwc | float }}"
      unit_of_measurement: "%"
      device_class: moisture
      state_class: measurement

    - name: "Irrigation Zone 1 State"
      unique_id: irrigation_zone1_state
      state_topic: "irrigation/zone/1/telemetry"
      value_template: "{{ value_json.state }}"

    - name: "Irrigation Zone 1 Fault Reason"
      unique_id: irrigation_zone1_fault_reason
      state_topic: "irrigation/zone/1/telemetry"
      value_template: "{{ value_json.fault_reason | default('none') }}"

    - name: "Irrigation Zone 1 Runtime Today"
      unique_id: irrigation_zone1_runtime_today
      state_topic: "irrigation/zone/1/telemetry"
      value_template: "{{ value_json.runtime_today_s }}"
      unit_of_measurement: "s"
      state_class: measurement

    - name: "Irrigation Zone 1 Runtime Hour"
      unique_id: irrigation_zone1_runtime_hour
      state_topic: "irrigation/zone/1/telemetry"
      value_template: "{{ value_json.runtime_hour_s }}"
      unit_of_measurement: "s"
      state_class: measurement

    - name: "Irrigation Zone 1 Pulse Count"
      unique_id: irrigation_zone1_pulse_count
      state_topic: "irrigation/zone/1/telemetry"
      value_template: "{{ value_json.pulse_count }}"
      state_class: total_increasing

    - name: "Irrigation Zone 1 Status"
      unique_id: irrigation_zone1_status
      state_topic: "irrigation/zone/1/status"

  # ── Binary sensors ────────────────────────────────────────────────────────────
  binary_sensor:

    - name: "Irrigation Zone 0 Valve"
      unique_id: irrigation_zone0_valve
      state_topic: "irrigation/zone/0/telemetry"
      value_template: "{{ value_json.valve_open }}"
      payload_on: "true"
      payload_off: "false"
      device_class: opening

    - name: "Irrigation Zone 0 Online"
      unique_id: irrigation_zone0_online
      state_topic: "irrigation/zone/0/status"
      payload_on: "online"
      payload_off: "offline"
      device_class: connectivity

    - name: "Irrigation Zone 1 Valve"
      unique_id: irrigation_zone1_valve
      state_topic: "irrigation/zone/1/telemetry"
      value_template: "{{ value_json.valve_open }}"
      payload_on: "true"
      payload_off: "false"
      device_class: opening

    - name: "Irrigation Zone 1 Online"
      unique_id: irrigation_zone1_online
      state_topic: "irrigation/zone/1/status"
      payload_on: "online"
      payload_off: "offline"
      device_class: connectivity

  # ── Buttons ───────────────────────────────────────────────────────────────────
  button:

    - name: "Irrigation Zone 0 Pulse"
      unique_id: irrigation_zone0_pulse
      command_topic: "irrigation/zone/0/command"
      payload_press: '{"action": "pulse"}'

    - name: "Irrigation Zone 0 Close"
      unique_id: irrigation_zone0_close
      command_topic: "irrigation/zone/0/command"
      payload_press: '{"action": "close"}'

    - name: "Irrigation Zone 0 Clear Fault"
      unique_id: irrigation_zone0_clear_fault
      command_topic: "irrigation/zone/0/command"
      payload_press: '{"action": "clear_fault"}'

    - name: "Irrigation Zone 1 Pulse"
      unique_id: irrigation_zone1_pulse
      command_topic: "irrigation/zone/1/command"
      payload_press: '{"action": "pulse"}'

    - name: "Irrigation Zone 1 Close"
      unique_id: irrigation_zone1_close
      command_topic: "irrigation/zone/1/command"
      payload_press: '{"action": "close"}'

    - name: "Irrigation Zone 1 Clear Fault"
      unique_id: irrigation_zone1_clear_fault
      command_topic: "irrigation/zone/1/command"
      payload_press: '{"action": "clear_fault"}'

# ── Automations ───────────────────────────────────────────────────────────────
automation:

  # Alert when a zone enters fault state
  - alias: "Irrigation Zone 0 Fault Alert"
    id: irrigation_zone0_fault_alert
    trigger:
      - platform: state
        entity_id: sensor.irrigation_zone_0_state
        to: "fault"
    action:
      - service: notify.notify
        data:
          title: "Irrigation Fault — Zone 0"
          message: "{{ states('sensor.irrigation_zone_0_fault_reason') }}"

  - alias: "Irrigation Zone 1 Fault Alert"
    id: irrigation_zone1_fault_alert
    trigger:
      - platform: state
        entity_id: sensor.irrigation_zone_1_state
        to: "fault"
    action:
      - service: notify.notify
        data:
          title: "Irrigation Fault — Zone 1"
          message: "{{ states('sensor.irrigation_zone_1_fault_reason') }}"

  # Alert when controller goes offline (LWT fired)
  - alias: "Irrigation Controller Offline Alert"
    id: irrigation_controller_offline_alert
    trigger:
      - platform: state
        entity_id: binary_sensor.irrigation_zone_0_online
        to: "off"
        for:
          seconds: 30
    action:
      - service: notify.notify
        data:
          title: "Irrigation Controller Offline"
          message: "The irrigation controller has lost MQTT connectivity."

  - alias: "Irrigation Zone 0 Apply Config"
    id: irrigation_zone0_apply_config
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - input_number.irrigation_zone0_pulse_duration
          - input_number.irrigation_zone0_settle_duration
          - input_number.irrigation_zone0_resume_vwc
          - input_number.irrigation_zone0_target_vwc
    action:
      - delay: "00:00:01"
      - service: mqtt.publish
        data:
          topic: "irrigation/zone/0/command"
          payload: >-
            {"action":"configure",
             "pulse_duration_s":{{ states('input_number.irrigation_zone0_pulse_duration') | int }},
             "settle_duration_s":{{ states('input_number.irrigation_zone0_settle_duration') | int }},
             "target_vwc":{{ states('input_number.irrigation_zone0_target_vwc') | float }},
             "resume_vwc":{{ states('input_number.irrigation_zone0_resume_vwc') | float }}}

  - alias: "Irrigation Zone 1 Apply Config"
    id: irrigation_zone1_apply_config
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - input_number.irrigation_zone1_pulse_duration
          - input_number.irrigation_zone1_settle_duration
          - input_number.irrigation_zone1_resume_vwc
          - input_number.irrigation_zone1_target_vwc
    action:
      - delay: "00:00:01"
      - service: mqtt.publish
        data:
          topic: "irrigation/zone/1/command"
          payload: >-
            {"action":"configure",
             "pulse_duration_s":{{ states('input_number.irrigation_zone1_pulse_duration') | int }},
             "settle_duration_s":{{ states('input_number.irrigation_zone1_settle_duration') | int }},
             "target_vwc":{{ states('input_number.irrigation_zone1_target_vwc') | float }},
             "resume_vwc":{{ states('input_number.irrigation_zone1_resume_vwc') | float }}}

  - alias: "Irrigation Apply Measurement Config"
    id: irrigation_apply_measurement_config
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - input_number.irrigation_sensor_interval
          - input_number.irrigation_telemetry_interval
    action:
      - delay: "00:00:01"
      - service: mqtt.publish
        data:
          topic: "irrigation/zone/0/command"
          payload: >-
            {"action":"configure",
             "sensor_interval_s":{{ states('input_number.irrigation_sensor_interval') | int }},
             "telemetry_interval_s":{{ states('input_number.irrigation_telemetry_interval') | int }}}
      - service: mqtt.publish
        data:
          topic: "irrigation/zone/1/command"
          payload: >-
            {"action":"configure",
             "sensor_interval_s":{{ states('input_number.irrigation_sensor_interval') | int }},
             "telemetry_interval_s":{{ states('input_number.irrigation_telemetry_interval') | int }}}

# ── Input helpers ──────────────────────────────────────────────────────────────
input_number:

  irrigation_zone0_pulse_duration:
    name: "Zone 0 Pulse Duration"
    min: 5
    max: 120
    step: 5
    initial: 30
    unit_of_measurement: "s"
    icon: mdi:timer-play-outline

  irrigation_zone0_settle_duration:
    name: "Zone 0 Settle Duration"
    min: 60
    max: 600
    step: 30
    initial: 300
    unit_of_measurement: "s"
    icon: mdi:timer-pause-outline

  irrigation_zone0_resume_vwc:
    name: "Zone 0 Resume VWC"
    min: 5
    max: 60
    step: 1
    initial: 25
    unit_of_measurement: "%"
    icon: mdi:water-minus

  irrigation_zone0_target_vwc:
    name: "Zone 0 Target VWC"
    min: 5
    max: 60
    step: 1
    initial: 40
    unit_of_measurement: "%"
    icon: mdi:water-check

  irrigation_zone1_pulse_duration:
    name: "Zone 1 Pulse Duration"
    min: 5
    max: 120
    step: 5
    initial: 30
    unit_of_measurement: "s"
    icon: mdi:timer-play-outline

  irrigation_zone1_settle_duration:
    name: "Zone 1 Settle Duration"
    min: 60
    max: 600
    step: 30
    initial: 300
    unit_of_measurement: "s"
    icon: mdi:timer-pause-outline

  irrigation_zone1_resume_vwc:
    name: "Zone 1 Resume VWC"
    min: 5
    max: 60
    step: 1
    initial: 25
    unit_of_measurement: "%"
    icon: mdi:water-minus

  irrigation_zone1_target_vwc:
    name: "Zone 1 Target VWC"
    min: 5
    max: 60
    step: 1
    initial: 40
    unit_of_measurement: "%"
    icon: mdi:water-check

  irrigation_sensor_interval:
    name: "Sensor Read Interval"
    min: 1
    max: 60
    step: 1
    initial: 5
    unit_of_measurement: "s"
    icon: mdi:clock-fast

  irrigation_telemetry_interval:
    name: "Telemetry Interval"
    min: 5
    max: 300
    step: 5
    initial: 10
    unit_of_measurement: "s"
    icon: mdi:broadcast

# ── Formatted m:ss display sensors ────────────────────────────────────────────
template:
  - sensor:
      - name: "Zone 0 Pulse Duration Display"
        unique_id: irrigation_zone0_pulse_dur_display
        state: >
          {% set s = states('input_number.irrigation_zone0_pulse_duration') | int(0) %}
          {{ s // 60 }}m {{ '%02d' % (s % 60) }}s
      - name: "Zone 0 Settle Duration Display"
        unique_id: irrigation_zone0_settle_dur_display
        state: >
          {% set s = states('input_number.irrigation_zone0_settle_duration') | int(0) %}
          {{ s // 60 }}m {{ '%02d' % (s % 60) }}s
      - name: "Zone 1 Pulse Duration Display"
        unique_id: irrigation_zone1_pulse_dur_display
        state: >
          {% set s = states('input_number.irrigation_zone1_pulse_duration') | int(0) %}
          {{ s // 60 }}m {{ '%02d' % (s % 60) }}s
      - name: "Zone 1 Settle Duration Display"
        unique_id: irrigation_zone1_settle_dur_display
        state: >
          {% set s = states('input_number.irrigation_zone1_settle_duration') | int(0) %}
          {{ s // 60 }}m {{ '%02d' % (s % 60) }}s

      - name: "Zone 0 VWC Numeric"
        unique_id: irrigation_zone0_vwc_numeric
        state: "{{ states('sensor.irrigation_zone_0_vwc') | float(0) }}"
        unit_of_measurement: "%"
        state_class: measurement

      - name: "Zone 1 VWC Numeric"
        unique_id: irrigation_zone1_vwc_numeric
        state: "{{ states('sensor.irrigation_zone_1_vwc') | float(0) }}"
        unit_of_measurement: "%"
        state_class: measurement

