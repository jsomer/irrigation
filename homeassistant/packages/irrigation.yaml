# ── Irrigation Package ────────────────────────────────────────────────────────
# Single solenoid valve + N moisture sensors (UNO R4 WiFi via MQTT)
#
# MQTT entities (sensors, binary sensors, buttons) are registered automatically
# via MQTT Discovery published by the firmware on each connect.
# This package only contains HA-native helpers and automations.
#
# ── Control model ───────────────────────────────────────────────────────────
# Home Assistant is the authoritative controller. The firmware's on-device
# auto-trigger is neutralised by pushing resume_vwc = 0.0 to every sensor (a
# real VWC reading can never fall below 0, so the firmware never self-pulses).
# HA then drives the valve exclusively via pulse / close commands. The firmware
# still enforces its hard safety limits (max pulse, hourly/daily runtime, settle
# gap, MQTT-loss failsafe) regardless of what HA requests.
#
# Each sensor is evaluated against four thresholds (low → high):
#   dry limit ≤ green-band low ≤ green-band high ≤ high limit
#
#   VWC ≤ dry limit ............ red  (dry) ......... → wants pulse ON
#   dry < VWC < green low ...... yellow (low) ....... → wants pulse ON
#   green low ≤ VWC ≤ green high green (target) ..... → pulse OFF
#   green high < VWC < high .... yellow (high) ...... → wants pulse OFF
#   VWC ≥ high limit ........... red  (saturated) ... → pulse OFF
#
# Conflict rule (single shared valve): DRY WINS — if any sensor wants water we
# irrigate, even if another sensor is wetter.
#
# Topic structure
#   irrigation/sensor/<id>/telemetry  →  per-sensor VWC readings
#   irrigation/sensor/<id>/config     ←  per-sensor dry threshold (forced to 0)
#   irrigation/valve/telemetry        →  valve state + runtime counters
#   irrigation/valve/command          ←  pulse / close / clear_fault / configure
#   irrigation/valve/status           →  online / offline (LWT, retained)
# ─────────────────────────────────────────────────────────────────────────────

# ── Input helpers ──────────────────────────────────────────────────────────────
input_number:
  # Valve timing — changes are pushed to firmware via automations below
  irrigation_pulse_duration:
    name: "Pulse Duration"
    min: 5
    max: 120
    step: 5
    initial: 30
    unit_of_measurement: "s"
    icon: mdi:timer-play-outline

  irrigation_settle_duration:
    name: "Settle Duration"
    min: 60
    max: 1800
    step: 30
    initial: 300
    unit_of_measurement: "s"
    icon: mdi:timer-sand

  # ── Sensor 0 moisture limits (used by HA decision logic) ──
  irrigation_sensor0_resume_vwc:
    name: "Sensor 0 Dry Limit"
    min: 5
    max: 60
    step: 1
    initial: 25
    unit_of_measurement: "%"
    icon: mdi:water-alert-outline

  irrigation_sensor0_green_low:
    name: "Sensor 0 Green Low"
    min: 5
    max: 60
    step: 1
    initial: 30
    unit_of_measurement: "%"
    icon: mdi:arrow-collapse-up

  irrigation_sensor0_green_high:
    name: "Sensor 0 Green High"
    min: 5
    max: 60
    step: 1
    initial: 40
    unit_of_measurement: "%"
    icon: mdi:arrow-collapse-down

  irrigation_sensor0_wet_limit:
    name: "Sensor 0 High Limit"
    min: 5
    max: 60
    step: 1
    initial: 50
    unit_of_measurement: "%"
    icon: mdi:water-plus-outline

  # ── Sensor 1 moisture limits ──
  irrigation_sensor1_resume_vwc:
    name: "Sensor 1 Dry Limit"
    min: 5
    max: 60
    step: 1
    initial: 25
    unit_of_measurement: "%"
    icon: mdi:water-alert-outline

  irrigation_sensor1_green_low:
    name: "Sensor 1 Green Low"
    min: 5
    max: 60
    step: 1
    initial: 30
    unit_of_measurement: "%"
    icon: mdi:arrow-collapse-up

  irrigation_sensor1_green_high:
    name: "Sensor 1 Green High"
    min: 5
    max: 60
    step: 1
    initial: 40
    unit_of_measurement: "%"
    icon: mdi:arrow-collapse-down

  irrigation_sensor1_wet_limit:
    name: "Sensor 1 High Limit"
    min: 5
    max: 60
    step: 1
    initial: 50
    unit_of_measurement: "%"
    icon: mdi:water-plus-outline

  # Display-only interval indicators (firmware values are compile-time constants)
  irrigation_sensor_interval:
    name: "Sensor Read Interval"
    min: 2
    max: 60
    step: 1
    initial: 5
    unit_of_measurement: "s"
    icon: mdi:update

  irrigation_telemetry_interval:
    name: "Telemetry Publish Interval"
    min: 5
    max: 120
    step: 5
    initial: 10
    unit_of_measurement: "s"
    icon: mdi:upload-network-outline

# ── Template sensors ───────────────────────────────────────────────────────────
template:
  - sensor:
      - name: "Pulse Duration Display"
        unique_id: irrigation_pulse_dur_display
        state: >
          {% set s = states('input_number.irrigation_pulse_duration') | int(0) %}
          {{ s // 60 }}m {{ '%02d' % (s % 60) }}s

      - name: "Settle Duration Display"
        unique_id: irrigation_settle_dur_display
        state: >
          {% set s = states('input_number.irrigation_settle_duration') | int(0) %}
          {{ s // 60 }}m {{ '%02d' % (s % 60) }}s

      # ── Per-sensor zone classification ──
      # state = dry | low_yellow | green | high_yellow | wet | unknown
      - name: "Irrigation Sensor 0 Zone"
        unique_id: irrigation_sensor_0_zone
        state: >
          {% set v = states('sensor.irrigation_controller_irrigation_sensor_0_vwc') | float(-1) %}
          {% set dry = states('input_number.irrigation_sensor0_resume_vwc') | float(0) %}
          {% set gl = [states('input_number.irrigation_sensor0_green_low') | float(0), dry] | max %}
          {% set gh = [states('input_number.irrigation_sensor0_green_high') | float(0), gl] | max %}
          {% set wet = [states('input_number.irrigation_sensor0_wet_limit') | float(0), gh] | max %}
          {% if v < 0 %}unknown
          {% elif v <= dry %}dry
          {% elif v < gl %}low_yellow
          {% elif v <= gh %}green
          {% elif v < wet %}high_yellow
          {% else %}wet{% endif %}
        attributes:
          vwc: "{{ states('sensor.irrigation_controller_irrigation_sensor_0_vwc') | float(0) | round(1) }}"
          dry: "{{ states('input_number.irrigation_sensor0_resume_vwc') | float(0) | round(1) }}"
          wet: "{{ states('input_number.irrigation_sensor0_wet_limit') | float(0) | round(1) }}"
          color: >
            {% set v = states('sensor.irrigation_controller_irrigation_sensor_0_vwc') | float(-1) %}
            {% set dry = states('input_number.irrigation_sensor0_resume_vwc') | float(0) %}
            {% set gl = [states('input_number.irrigation_sensor0_green_low') | float(0), dry] | max %}
            {% set gh = [states('input_number.irrigation_sensor0_green_high') | float(0), gl] | max %}
            {% set wet = [states('input_number.irrigation_sensor0_wet_limit') | float(0), gh] | max %}
            {% if v < 0 %}grey
            {% elif v <= dry or v >= wet %}red
            {% elif v < gl or v > gh %}yellow
            {% else %}green{% endif %}

      - name: "Irrigation Sensor 1 Zone"
        unique_id: irrigation_sensor_1_zone
        state: >
          {% set v = states('sensor.irrigation_controller_irrigation_sensor_1_vwc') | float(-1) %}
          {% set dry = states('input_number.irrigation_sensor1_resume_vwc') | float(0) %}
          {% set gl = [states('input_number.irrigation_sensor1_green_low') | float(0), dry] | max %}
          {% set gh = [states('input_number.irrigation_sensor1_green_high') | float(0), gl] | max %}
          {% set wet = [states('input_number.irrigation_sensor1_wet_limit') | float(0), gh] | max %}
          {% if v < 0 %}unknown
          {% elif v <= dry %}dry
          {% elif v < gl %}low_yellow
          {% elif v <= gh %}green
          {% elif v < wet %}high_yellow
          {% else %}wet{% endif %}
        attributes:
          vwc: "{{ states('sensor.irrigation_controller_irrigation_sensor_1_vwc') | float(0) | round(1) }}"
          dry: "{{ states('input_number.irrigation_sensor1_resume_vwc') | float(0) | round(1) }}"
          wet: "{{ states('input_number.irrigation_sensor1_wet_limit') | float(0) | round(1) }}"
          color: >
            {% set v = states('sensor.irrigation_controller_irrigation_sensor_1_vwc') | float(-1) %}
            {% set dry = states('input_number.irrigation_sensor1_resume_vwc') | float(0) %}
            {% set gl = [states('input_number.irrigation_sensor1_green_low') | float(0), dry] | max %}
            {% set gh = [states('input_number.irrigation_sensor1_green_high') | float(0), gl] | max %}
            {% set wet = [states('input_number.irrigation_sensor1_wet_limit') | float(0), gh] | max %}
            {% if v < 0 %}grey
            {% elif v <= dry or v >= wet %}red
            {% elif v < gl or v > gh %}yellow
            {% else %}green{% endif %}

      # ── Master pulse decision + human-readable reason ──
      # state = on | off    (drives the pulse-driver and stop automations)
      - name: "Irrigation Pulse Decision"
        unique_id: irrigation_pulse_decision
        icon: mdi:water-pump
        state: >
          {% set zones = [states('sensor.irrigation_sensor_0_zone'),
                          states('sensor.irrigation_sensor_1_zone')] %}
          {% if 'dry' in zones %}on
          {% elif 'wet' in zones %}off
          {% elif zones | reject('equalto', 'green') | list | length == 0 %}off
          {% elif 'low_yellow' in zones %}on
          {% elif 'high_yellow' in zones %}off
          {% else %}off{% endif %}
        attributes:
          reason: >
            {% set e = ['sensor.irrigation_sensor_0_zone',
                        'sensor.irrigation_sensor_1_zone'] %}
            {% set zones = [states(e[0]), states(e[1])] %}
            {% if 'dry' in zones %}
              {% set i = zones.index('dry') %}
              Sensor {{ i }} dry ({{ state_attr(e[i], 'vwc') }}% ≤ {{ state_attr(e[i], 'dry') }}% dry limit)
            {% elif 'wet' in zones %}
              {% set i = zones.index('wet') %}
              Sensor {{ i }} saturated ({{ state_attr(e[i], 'vwc') }}% ≥ {{ state_attr(e[i], 'wet') }}% high limit)
            {% elif zones | reject('equalto', 'green') | list | length == 0 %}
              All sensors in target range
            {% elif 'low_yellow' in zones %}
              {% set i = zones.index('low_yellow') %}
              Sensor {{ i }} trending dry (yellow-low)
            {% elif 'high_yellow' in zones %}
              {% set i = zones.index('high_yellow') %}
              Sensor {{ i }} trending wet (yellow-high)
            {% else %}
              Waiting for sensor data
            {% endif %}

# ── Automations ────────────────────────────────────────────────────────────────
automation:
  # -- Alerts --
  - alias: "Irrigation Valve Fault Alert"
    id: irrigation_valve_fault_alert
    trigger:
      - platform: state
        entity_id: sensor.irrigation_controller_irrigation_valve_state
        to: "fault"
    action:
      - service: persistent_notification.create
        data:
          title: "Irrigation Fault"
          message: "Valve entered fault state. Check the controller."

  - alias: "Irrigation Controller Offline Alert"
    id: irrigation_controller_offline_alert
    trigger:
      - platform: state
        entity_id: binary_sensor.irrigation_controller_online
        to: "off"
        for: "00:02:00"
    action:
      - service: persistent_notification.create
        data:
          title: "Irrigation Offline"
          message: "Controller has been offline for 2 minutes."

  # -- Valve timing: push slider changes to firmware --
  - alias: "Irrigation Apply Valve Config"
    id: irrigation_apply_valve_config
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - input_number.irrigation_pulse_duration
          - input_number.irrigation_settle_duration
    action:
      - delay: "00:00:01"
      - service: mqtt.publish
        data:
          topic: "irrigation/valve/command"
          payload: >-
            {"action":"configure",
             "pulse_duration_s":{{ states('input_number.irrigation_pulse_duration') | int }},
             "settle_duration_s":{{ states('input_number.irrigation_settle_duration') | int }}}

  # -- Neutralise the firmware's on-device auto-trigger so HA is authoritative --
  # Pushing resume_vwc = 0.0 means no real reading can ever cross the threshold,
  # so the firmware never self-pulses. Re-asserted whenever the controller
  # (re)connects, in case it rebooted back to its compiled-in defaults.
  - alias: "Irrigation Disable Firmware Auto-Trigger"
    id: irrigation_disable_fw_autotrigger
    mode: restart
    trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: binary_sensor.irrigation_controller_online
        to: "on"
    action:
      - delay: "00:00:02"
      - service: mqtt.publish
        data:
          topic: "irrigation/sensor/0/config"
          payload: '{"resume_vwc": 0.0}'
      - service: mqtt.publish
        data:
          topic: "irrigation/sensor/1/config"
          payload: '{"resume_vwc": 0.0}'

  # -- Pulse driver: while the decision is ON and the valve is idle, request a
  #    pulse. The firmware gates the actual open via its settle/runtime limits,
  #    so re-requesting on a short cadence is safe. --
  - alias: "Irrigation Pulse Driver"
    id: irrigation_pulse_driver
    mode: single
    trigger:
      - platform: time_pattern
        seconds: "/30"
      - platform: state
        entity_id: sensor.irrigation_pulse_decision
        to: "on"
    condition:
      - condition: state
        entity_id: sensor.irrigation_pulse_decision
        state: "on"
      - condition: state
        entity_id: binary_sensor.irrigation_controller_online
        state: "on"
      - condition: state
        entity_id: sensor.irrigation_controller_irrigation_valve_state
        state: "idle"
    action:
      - service: mqtt.publish
        data:
          topic: "irrigation/valve/command"
          payload: '{"action": "pulse"}'

  # -- Stop: when the decision turns OFF, force the valve closed (handles the
  #    "saturated / high limit" case mid-pulse; harmless when already idle). --
  - alias: "Irrigation Stop On Decision Off"
    id: irrigation_stop_on_decision_off
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.irrigation_pulse_decision
        to: "off"
    condition:
      - condition: state
        entity_id: binary_sensor.irrigation_controller_online
        state: "on"
    action:
      - service: mqtt.publish
        data:
          topic: "irrigation/valve/command"
          payload: '{"action": "close"}'
