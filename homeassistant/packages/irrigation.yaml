# ── Irrigation Package ────────────────────────────────────────────────────────
# Single solenoid valve + N moisture sensors (UNO R4 WiFi via MQTT)
#
# MQTT entities (sensors, binary sensors, buttons) are registered automatically
# via MQTT Discovery published by the firmware on each connect.
# This package only contains HA-native helpers and automations.
#
# ── Control model ───────────────────────────────────────────────────────────
# Firmware is the authoritative controller for when to water. On-device
# auto-trigger fires when any sensor VWC drops below its resume_vwc threshold.
# HA pushes slider values to the device and provides monitoring, manual
# override (pulse / close / clear_fault), and alerts. Firmware still enforces
# hard safety limits (max pulse, hourly/daily runtime, settle gap, MQTT-loss
# failsafe) independently of HA.
#
# Topic structure
#   irrigation/sensor/<id>/telemetry  →  per-sensor VWC readings
#   irrigation/sensor/<id>/config     ←  per-sensor dry threshold (resume_vwc)
#   irrigation/valve/telemetry        →  valve state + runtime counters
#   irrigation/valve/command          ←  pulse / close / clear_fault / configure
#   irrigation/valve/status           →  online / offline (LWT, retained)
# ─────────────────────────────────────────────────────────────────────────────

# ── Input helpers ──────────────────────────────────────────────────────────────
input_number:
  # Valve timing — changes are pushed to firmware via automations below
  irrigation_pulse_duration:
    name: "Pulse Duration"
    min: 5
    max: 120
    step: 5
    initial: 30
    unit_of_measurement: "s"
    icon: mdi:timer-play-outline

  irrigation_settle_duration:
    name: "Settle Duration"
    min: 60
    max: 1800
    step: 30
    initial: 300
    unit_of_measurement: "s"
    icon: mdi:timer-sand

  # Per-sensor dry thresholds — changes are pushed to firmware via automations below
  irrigation_sensor0_resume_vwc:
    name: "Sensor 0 Resume VWC"
    min: 5
    max: 60
    step: 1
    initial: 25
    unit_of_measurement: "%"
    icon: mdi:water-alert-outline

  irrigation_sensor1_resume_vwc:
    name: "Sensor 1 Resume VWC"
    min: 5
    max: 60
    step: 1
    initial: 25
    unit_of_measurement: "%"
    icon: mdi:water-alert-outline

# ── Template sensors ───────────────────────────────────────────────────────────
template:
  - sensor:
      - name: "Pulse Duration Display"
        unique_id: irrigation_pulse_dur_display
        state: >
          {% set s = states('input_number.irrigation_pulse_duration') | int(0) %}
          {{ s // 60 }}m {{ '%02d' % (s % 60) }}s

      - name: "Settle Duration Display"
        unique_id: irrigation_settle_dur_display
        state: >
          {% set s = states('input_number.irrigation_settle_duration') | int(0) %}
          {{ s // 60 }}m {{ '%02d' % (s % 60) }}s

# ── Automations ────────────────────────────────────────────────────────────────
automation:
  # -- Alerts --
  - alias: "Irrigation Valve Fault Alert"
    id: irrigation_valve_fault_alert
    trigger:
      - platform: state
        entity_id: sensor.irrigation_controller_irrigation_valve_state
        to: "fault"
    action:
      - service: persistent_notification.create
        data:
          title: "Irrigation Fault"
          message: "Valve entered fault state. Check the controller."

  - alias: "Irrigation Controller Offline Alert"
    id: irrigation_controller_offline_alert
    trigger:
      - platform: state
        entity_id: binary_sensor.irrigation_controller_online
        to: "off"
        for: "00:02:00"
    action:
      - service: persistent_notification.create
        data:
          title: "Irrigation Offline"
          message: "Controller has been offline for 2 minutes."

  # -- Valve timing: push slider changes to firmware --
  - alias: "Irrigation Apply Valve Config"
    id: irrigation_apply_valve_config
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - input_number.irrigation_pulse_duration
          - input_number.irrigation_settle_duration
    action:
      - delay: "00:00:01"
      - service: mqtt.publish
        data:
          topic: "irrigation/valve/command"
          payload: >-
            {"action":"configure",
             "pulse_duration_s":{{ states('input_number.irrigation_pulse_duration') | int }},
             "settle_duration_s":{{ states('input_number.irrigation_settle_duration') | int }}}

  # -- Sensor dry thresholds: push slider changes to firmware --
  - alias: "Irrigation Apply Sensor 0 Config"
    id: irrigation_apply_sensor0_config
    mode: restart
    trigger:
      - platform: state
        entity_id: input_number.irrigation_sensor0_resume_vwc
    action:
      - delay: "00:00:01"
      - service: mqtt.publish
        data:
          topic: "irrigation/sensor/0/config"
          payload: >-
            {"resume_vwc":{{ states('input_number.irrigation_sensor0_resume_vwc') | float }}}

  - alias: "Irrigation Apply Sensor 1 Config"
    id: irrigation_apply_sensor1_config
    mode: restart
    trigger:
      - platform: state
        entity_id: input_number.irrigation_sensor1_resume_vwc
    action:
      - delay: "00:00:01"
      - service: mqtt.publish
        data:
          topic: "irrigation/sensor/1/config"
          payload: >-
            {"resume_vwc":{{ states('input_number.irrigation_sensor1_resume_vwc') | float }}}

  # -- Sync firmware state on (re)connect ──────────────────────────────────────
  # Fired on HA start and every time the controller comes online, so a firmware
  # reboot ends up with the same resume_vwc and valve timing as the HA sliders.
  - alias: "Irrigation Sync Firmware On Connect"
    id: irrigation_sync_fw_on_connect
    mode: restart
    trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: binary_sensor.irrigation_controller_online
        to: "on"
    action:
      - delay: "00:00:02"
      - service: mqtt.publish
        data:
          topic: "irrigation/sensor/0/config"
          payload: >-
            {"resume_vwc":{{ states('input_number.irrigation_sensor0_resume_vwc') | float }}}
      - service: mqtt.publish
        data:
          topic: "irrigation/sensor/1/config"
          payload: >-
            {"resume_vwc":{{ states('input_number.irrigation_sensor1_resume_vwc') | float }}}
      - service: mqtt.publish
        data:
          topic: "irrigation/valve/command"
          payload: >-
            {"action":"configure",
             "pulse_duration_s":{{ states('input_number.irrigation_pulse_duration') | int }},
             "settle_duration_s":{{ states('input_number.irrigation_settle_duration') | int }}}
