[platformio]
default_envs = uno_r4_wifi

# ── Shared settings ───────────────────────────────────────────────────────────
[env]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200

lib_deps =
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7.2

# ── Development build (verbose serial logging) ────────────────────────────────
[env:uno_r4_wifi]
build_flags =
  -DCORE_DEBUG_LEVEL=3   ; enable I/W/E log output on Serial

# ── Release build (logging suppressed, smaller binary) ───────────────────────
[env:uno_r4_wifi_release]
build_flags =
  -DNDEBUG
  -DCORE_DEBUG_LEVEL=0
