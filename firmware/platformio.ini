[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7.2

build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DLOG_LOCAL_LEVEL=ESP_LOG_DEBUG

[env:esp32dev_release]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7.2

build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DNDEBUG
